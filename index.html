/* render fonts from the fonts folder */
@font-face {
    font-family: "Playfair Display";
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url("fonts/playfair-display-600.woff2") format("woff2");
}

@font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/ibm-plex-mono-400.woff2") format("woff2");
}

@font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url("fonts/ibm-plex-mono-500.woff2") format("woff2");
}

/* dark theme by default */
:root {
    color-scheme: light dark;

    --clr-bg: #000;
    --clr-text: #fff;
    --clr-text-dim: rgba(255, 255, 255, 0.75);
    --clr-text-muted: rgba(255, 255, 255, 0.4);
    --clr-overlay: rgba(0, 0, 0, 0.85);

    --space-md: 1.5rem;
    --space-lg: 2rem;

    --font-display: "Playfair Display", Georgia, serif;
    --font-mono: "IBM Plex Mono", "Courier New", monospace;
    --text-xs: clamp(0.55rem, 1.5vw, 0.75rem);
    --text-base: clamp(0.65rem, 2.2vw, 0.9rem);

    --max-width: 52rem;
}

@media (prefers-color-scheme: light) {
    :root {
        --clr-bg: #fff;
        --clr-text: #000;
        --clr-text-dim: rgba(0, 0, 0, 0.75);
        --clr-text-muted: rgba(0, 0, 0, 0.5);
        --clr-overlay: rgba(255, 255, 255, 0.85);
    }
}

@media (prefers-contrast: high) {
    :root {
        --clr-text-dim: var(--clr-text);
    }
}

/* Base */
*,
::before,
::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--clr-bg);
    color: var(--clr-text);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.content-container {
    position: relative;
    height: 100vh;
    height: 100dvh; /* check footer height */
    display: flex;
    flex-direction: column;
}

/* Header */
header {
    position: absolute;
    inset: 0 0 auto;
    padding: var(--space-lg);
    background: linear-gradient(
        180deg,
        var(--clr-bg) 0%,
        var(--clr-overlay) 60%,
        transparent 100%
    );
    pointer-events: none;
}

header nav {
    display: flex;
    justify-content: center;
    align-items: center;
}

.nav-home {
    font-size: 3.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
}

/* Main */
main {
    flex: 1;
    display: flex;
    padding: var(--space-lg);
    overflow-y: auto;
}

/* margin checks */
.about-wrapper {
    width: 100%;
    max-width: var(--max-width);
    margin: auto;
}

.about-content {
    padding: var(--space-md);
    text-align: center;
}

.bio-text {
    font-family: var(--font-mono);
    font-size: var(--text-base);
    line-height: 2;
    letter-spacing: 0.03em;
    color: var(--clr-text-dim);
}

/* Footer */
footer {
    position: absolute;
    inset: auto 0 0;
    padding: var(--space-lg);
    text-align: center;
}

.social-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--space-lg);
    margin-bottom: var(--space-md);
}

.social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.7rem;
    height: 1.7rem;
    color: var(--clr-text);
    font-size: 2rem;
    text-decoration: none;
    transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.social-link svg {
    flex: none;
    width: 1em;
    height: 1em;
    fill: currentColor;
}

/* no link dim */
@media (hover: hover) {
    .social-link:hover {
        opacity: 0.5;
    }
}

.copyright {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--clr-text-muted);
}

/* responsive sizing on icons */
@media (max-width: 768px) {
    :root {
        --space-lg: 1.5rem;
    }

    .social-link {
        width: 3rem;
        height: 3rem;
        font-size: 1.75rem;
    }
}

@media (max-width: 480px) {
    :root {
        --space-md: 1rem;
        --space-lg: 1rem;
    }

    .social-link {
        width: 2.75rem;
        height: 2.75rem;
        font-size: 1.5rem;
    }
}

/* Selection & keyboard focus */
::selection {
    background-color: var(--clr-text);
    color: var(--clr-bg);
}

:focus-visible {
    outline: 2px solid var(--clr-text-dim);
    outline-offset: 4px;
}
